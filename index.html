<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>AI Poem Generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>AI Spanish Poem Generator</h1>
      </header>

      <main>
        <form>
          <input
            type="text"
            placeholder="Enter the topic of the Spanish poem"
            autofocus
            required
            autocomplete="off"
            class="instructions"
          />
          <input type="submit" class="submit-button" />
        </form>
        <div class="poem">
          Verde que te quiero verde. </br> Verde viento. </br> Verdes ramas. </br> El barco sobre
          la mar y el caballo en la montaña.<br />
        </div>
      </main>
      <footer>
        This AI project was coded by
        <a href="https://github.com/Noki16-hr" target="_blank"
          >Noelia Jiménez</a
        >
        and is
        <a
          href="https://github.com/Noki16-hr/spanish-poem-generator"
          target="_blank"
          >open-sourced on GitHub</a
        >
        and is hosted on
        <a href="https://spanish-poem-generator.onrender.com" target="_blank"
          >Render</a
        >
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
